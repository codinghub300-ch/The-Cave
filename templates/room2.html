<!DOCTYPE html>
<html lang="en">
<head>
    <title>Room 2: Encrypted Runes</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .rune-stone {
            background: #222;
            border: 2px solid #444;
            padding: 40px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .rune-stone::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(45deg, transparent, transparent 10px, rgba(255,183,3,0.02) 10px, rgba(255,183,3,0.02) 20px);
        }
        .cipher-text {
            font-size: 28px;
            color: var(--accent);
            letter-spacing: 5px;
            text-shadow: 0 0 8px var(--accent);
            margin: 30px 0;
            word-break: break-all;
        }
    </style>
</head>
<body>
    
    <script src="{{ url_for('static', filename='js/game.js') }}"></script>

    <div class="container">
        <h1 class="glow">Room 2: The Chamber of Runes</h1>
        <p>A glowing stone stands in the center of the room. Its surface ripples with shifting symbols.</p>
        
        <div class="rune-stone">
            <div class="cipher-text">Q0FWRXtwcm90b2NvbF9kZWNvZGVyfQ==</div>
            <p style="font-style: italic; color: #888;">"The ancients used 64 bases to support their towers..."</p>
        </div>

        <div class="input-zone" style="margin-top: 30px;">
            <input type="text" id="flag-input" placeholder="CAVE{...}">
            <button onclick="submitFlag('room2')">Shatter the Rune</button>
        </div>
    </div>
</body>
</html>
